<style>
    .card {
        border-radius: 12px;
    }

    h2 {
        font-weight: 600;
    }
</style>

{% extends 'staffs/staff_index.html' %}

{% block content %}

<h2 class="mb-4">Add / Edit Attendance</h2>

<form method="post">
    {% csrf_token %}

    {% for field in form %}
    <div class="mb-3">
        <label for="{{ field.id_for_label }}" class="form-label">{{ field.label }}</label>
        {{ field }}
        {% if field.help_text %}
        <small class="form-text text-muted">{{ field.help_text }}</small>
        {% endif %}
        {% for error in field.errors %}
        <div class="text-danger">{{ error }}</div>
        {% endfor %}
    </div>
    {% endfor %}

    <button type="submit" class="btn btn-success">Save</button>
</form>

{% endblock %}
