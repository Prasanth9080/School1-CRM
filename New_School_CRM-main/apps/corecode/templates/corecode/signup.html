{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta http-equiv="x-ua-compatible" content="ie=edge">
    <title>Signup - Sample-School</title>

    <link rel="stylesheet" href="{% static 'plugins/fontawesome-free/css/all.min.css' %}">
    <link rel="stylesheet" href="{% static 'plugins/toastr/toastr.min.css' %}">
    <link rel="stylesheet" href="{% static 'plugins/overlayScrollbars/css/OverlayScrollbars.min.css' %}">
    <link rel="stylesheet" href="{% static 'dist/css/adminlte.min.css' %}">
    <link rel="stylesheet" href="{% static 'dist/css/login-page.css' %}">
    <link rel="shortcut icon" type="image/x-icon" href="{% static 'dist/img/sclfav.png' %}">
</head>

<body>
    <div class="limiter">
        <div class="container-login100">
            <div class="wrap-login100">
                <div class="login100-pic js-tilt" style="width: 400px;">
                    <img src="{% static 'dist/img/school.png' %}" alt="School Image">
                </div>

                <form class="login100-form validate-form" method="post" action="{% url 'signup' %}"
                    onsubmit="return validateForm()">
                    {% csrf_token %}
                    <span class="login100-form-title">Signup</span>

                    {% if messages %}
                    {% for message in messages %}
                    <script>
                        document.addEventListener("DOMContentLoaded", function () {
                            toastr["{{ message.tags }}"]("{{ message }}");
                        });
                    </script>
                    {% endfor %}
                    {% endif %}

                    <div class="wrap-input100">
                        <input class="input100" type="text" id="first_name" name="first_name" placeholder="First Name"
                            autocomplete="off">
                        <span class="focus-input100"></span>
                        <span class="symbol-input100"><i class="fa fa-user"></i></span>
                        <span class="error-msg" id="first-name-error"></span>
                    </div>

                    <div class="wrap-input100">
                        <input class="input100" type="text" id="last_name" name="last_name" placeholder="Last Name"
                            autocomplete="off">
                        <span class="focus-input100"></span>
                        <span class="symbol-input100"><i class="fa fa-user"></i></span>
                        <span class="error-msg" id="last-name-error"></span>
                    </div>

                    <div class="wrap-input100">
                        <input class="input100" type="email" id="email" name="email" placeholder="Email"
                            autocomplete="off">
                        <span class="focus-input100"></span>
                        <span class="symbol-input100"><i class="fa fa-envelope"></i></span>
                        <span class="error-msg" id="email-error"></span>
                    </div>

                    <div class="wrap-input100">
                        <input class="input100" type="text" id="username" name="username" placeholder="Username"
                            autocomplete="off">
                        <span class="focus-input100"></span>
                        <span class="symbol-input100"><i class="fa fa-user"></i></span>
                        <span class="error-msg" id="username-error"></span>
                    </div>

                    <div class="wrap-input100">
                        <input class="input100" type="password" id="password" name="password" placeholder="Password">
                        <span class="focus-input100"></span>
                        <span class="symbol-input100"><i class="fa fa-lock"></i></span>
                        <span class="error-msg" id="password-error"></span>
                    </div>

                    <div class="container-login100-form-btn">
                        <button class="login100-form-btn" type="submit">Signup</button>
                    </div>

                    <div class="text-center p-t-12">
                        <span class="txt1">Already have an account?</span>
                        <a class="txt2" href="{% url 'login' %}">Login</a>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="{% static 'plugins/jquery/jquery.min.js' %}"></script>
    <script src="{% static 'plugins/bootstrap/js/bootstrap.bundle.min.js' %}"></script>
    <script src="{% static 'plugins/toastr/toastr.min.js' %}"></script>
    <script src="{% static 'plugins/overlayScrollbars/js/jquery.overlayScrollbars.min.js' %}"></script>
    <script src="{% static 'dist/js/adminlte.js' %}"></script>
    <script src="{% static 'dist/js/demo.js' %}"></script>

    <!-- Client-side Form Validation -->
    <script>
        function validateForm() {
            const fields = [
                { id: "first_name", errorId: "first-name-error", message: "Please enter your first name" },
                { id: "last_name", errorId: "last-name-error", message: "Please enter your last name" },
                { id: "email", errorId: "email-error", message: "Please enter your Email-id" },
                { id: "username", errorId: "username-error", message: "Please enter your Username" },
                { id: "password", errorId: "password-error", message: "Please enter your password" }
            ];

            let isValid = true;

            fields.forEach(field => {
                const value = document.getElementById(field.id).value;
                const errorElement = document.getElementById(field.errorId);
                if (value.trim() === "") {
                    errorElement.innerText = field.message;
                    isValid = false;
                } else {
                    errorElement.innerText = "";
                }
            });

            return isValid;
        }
    </script>
</body>

</html>
