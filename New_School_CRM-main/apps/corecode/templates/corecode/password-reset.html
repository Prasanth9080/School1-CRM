{% load static %}
{% load widget_tweaks %}
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta http-equiv="x-ua-compatible" content="ie=edge">
    <title>Forgot Password</title>

    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="{% static 'plugins/fontawesome-free/css/all.min.css' %}">
    <link rel="stylesheet" href="{% static 'plugins/toastr/toastr.min.css' %}">
    <link rel="stylesheet" href="{% static 'plugins/overlayScrollbars/css/OverlayScrollbars.min.css' %}">
    <link rel="stylesheet" href="{% static 'dist/css/adminlte.min.css' %}">
    <link rel="stylesheet" href="{% static 'dist/css/login-page.css' %}">
    <link rel="shortcut icon" type="image/x-icon" href="{% static 'dist/img/sclfav.png' %}">
</head>

<body>
    <div class="limiter">
        <div class="container-login100">
            <div class="wrap-login100">
                <div class="login100-pic js-tilt" style="width: 400px;">
                    <img src="{% static 'dist/img/school.png' %}">
                </div>

                <div id="message-container">
                    <form id="password-reset-form" class="login100-form validate-form" method="post"
                        action="{% url 'password_reset' %}">
                        {% csrf_token %}
                        <span class="login100-form-title">Forgot Password</span>

                        <div class="wrap-input100 validate-input" data-validate="Valid email is required: ex@abc.xyz">
                            <input class="input100" id="id_email" name="email" type="email" placeholder="Email">
                            <span class="focus-input100"></span>
                            <span class="symbol-input100"><i class="fa fa-envelope" aria-hidden="true"></i></span>
                            <span class="error-msg" id="email-error"></span>
                        </div>

                        <div class="container-login100-form-btn">
                            <button class="login100-form-btn" type="submit">Reset Password</button>
                        </div>

                        <div class="text-center p-t-12">
                            <a class="txt2" href="{% url 'login' %}">Back to Login</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <!-- JS Scripts -->
    <script src="{% static 'plugins/jquery/jquery.min.js' %}"></script>
    <script src="{% static 'plugins/bootstrap/js/bootstrap.bundle.min.js' %}"></script>
    <script src="{% static 'plugins/toastr/toastr.min.js' %}"></script>
    <script src="{% static 'plugins/overlayScrollbars/js/jquery.overlayScrollbars.min.js' %}"></script>
    <script src="{% static 'dist/js/adminlte.js' %}"></script>

    <script>
        $(document).ready(function () {
            $('#password-reset-form').on('submit', function (event) {
                event.preventDefault(); // Prevent full page reload

                const email = $('#id_email').val().trim();
                let valid = true;

                if (email === "") {
                    $('#email-error').text('Please enter your email address');
                    setTimeout(() => { $('#email-error').text(''); }, 3000);
                    valid = false;
                } else {
                    $('#email-error').text('');
                }

                if (valid) {
                    $.ajax({
                        type: 'POST',
                        url: $(this).attr('action'),
                        data: $(this).serialize(),
                        success: function (response) {
                            $('#message-container').html(`
                                <div class="login100-form validate-form">
                                    <span class="login100-form-title">Password Reset Email Sent</span>
                                    <p>An email has been sent to your address with instructions to reset your password. You may close this tab.</p>
                                </div>
                            `);
                            toastr.success('An email has been sent with instructions to reset your password.');
                        },
                        error: function (xhr) {
                            let errorMsg = 'There was an error processing your request. Please try again.';
                            if (xhr.responseJSON && xhr.responseJSON.error) {
                                errorMsg = xhr.responseJSON.error;
                            }
                            toastr.error(errorMsg);
                        }
                    });
                }
            });
        });
    </script>

    {% if messages %}
    {% for message in messages %}
    <script type="text/javascript">
        toastr.options.progressBar = true;
        toastr["{{ message.tags }}"]('{{ message }}');
    </script>
    {% endfor %}
    {% endif %}

</body>

</html>
